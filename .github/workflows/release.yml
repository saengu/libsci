name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      sci_ref:
        description: "babashka/sci branch/tag/commit to build"
        required: true
        type: string
      release_tag:
        description: "release tag (e.g. v0.1.0)"
        required: true
        type: string

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            arch: x86_64

          - name: linux-aarch64
            os: ubuntu-24.04-arm
            arch: aarch64

          - name: macos-x86_64
            os: macos-15-intel
            arch: x86_64

          - name: macos-aarch64
            os: macos-latest
            arch: aarch64

          - name: windows-x86_64
            os: windows-latest
            arch: x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Switch submodule to specified SCI ref (manual trigger)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: sci
        run: |
          git fetch origin --tags
          git checkout "${{ inputs.sci_ref }}"
          echo "SCI ref: $(git rev-parse --short HEAD)"

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm"
          components: "native-image"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Leiningen
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          lein: "2.11.2"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('project.clj') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Build libsci shared library
        shell: bash
        run: ./scripts/build.sh
        env:
          GRAALVM_HOME: ${{ env.JAVA_HOME }}

      - name: Fix macOS dylib install name
        if: runner.os == 'macOS'
        run: install_name_tool -id "@rpath/libsci.dylib" target/libsci.dylib

      - name: Install zip on Windows
        if: matrix.os == 'windows-latest'
        run: choco install zip -y

      - name: Package release artifact
        shell: bash
        run: |
          mkdir -p release/lib release/include
          cp target/libsci.* release/lib/ 2>/dev/null || true
          cp target/*.h release/include/
          cd release && zip -r "../libsci-${{ matrix.name }}.zip" .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: libsci-${{ matrix.name }}.zip
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: false

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: List artifacts
        run: find release-artifacts -type f

      - name: Create GitHub Release
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --generate-notes \
            release-artifacts/*/libsci-*.zip
        env:
          GH_TOKEN: ${{ github.token }}
