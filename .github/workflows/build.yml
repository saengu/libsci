name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sci_ref:
        description: "babashka/sci branch/tag/commit to build"
        required: false
        default: ""
        type: string

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            arch: x86_64

          - name: linux-aarch64
            os: ubuntu-24.04-arm
            arch: aarch64

          - name: macos-x86_64
            os: macos-15-intel
            arch: x86_64

          - name: macos-aarch64
            os: macos-latest
            arch: aarch64

          - name: windows-x86_64
            os: windows-latest
            arch: x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Switch submodule to specified SCI ref
        if: ${{ inputs.sci_ref != '' }}
        working-directory: sci
        run: |
          git fetch origin --tags
          git checkout "${{ inputs.sci_ref }}"
          echo "SCI ref: $(git rev-parse --short HEAD)"

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm"
          components: "native-image"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Leiningen
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          lein: "2.11.2"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('project.clj') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Build libsci shared library
        shell: bash
        run: ./scripts/build.sh
        env:
          GRAALVM_HOME: ${{ env.JAVA_HOME }}

      - name: Fix macOS dylib install name
        if: runner.os == 'macOS'
        run: install_name_tool -id "@rpath/libsci.dylib" target/libsci.dylib

      - name: List build artifacts
        shell: bash
        run: ls -la target/

      - name: Upload shared library
        uses: actions/upload-artifact@v4
        with:
          name: libsci-${{ matrix.name }}
          path: |
            target/libsci.*
            target/*.h
          if-no-files-found: error

  test-integration:
    name: Test (${{ matrix.name }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-x86_64
            os: macos-15-intel
          - name: macos-aarch64
            os: macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download libsci artifact
        uses: actions/download-artifact@v4
        with:
          name: libsci-${{ matrix.name }}
          path: target

      - name: C integration test
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            export LD_LIBRARY_PATH="$(pwd)/target:${LD_LIBRARY_PATH:-}"
          else
            export DYLD_LIBRARY_PATH="$(pwd)/target:${DYLD_LIBRARY_PATH:-}"
          fi
          gcc tests/c/from_c_host.c -I target -L target -lsci -o tests/c/from_c_host
          tests/c/from_c_host
